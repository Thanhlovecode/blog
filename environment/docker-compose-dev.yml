services:
  redis:
    image: redis:8.4.0-alpine
    container_name: redis-server
    restart: always

    # Chỉ expose nếu cần access từ host
    ports:
      - "127.0.0.1:6379:6379"



    # Environment variables
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-thanhdeptrai}

    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-thanhdeptrai}
      --appendonly yes 
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 512mb 
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 60

    volumes:
      - redis_data:/data
      # Optional: custom config file
      # - ./redis.conf:/usr/local/etc/redis/redis. conf

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 640M
        reservations:
          cpus: '0.25'
          memory: 256M

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-thanhdeptrai}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

    sysctls:
      - net.core.somaxconn=1024

    logging:
      driver:  "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data: